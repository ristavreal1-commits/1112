name: Build Plugin
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compile JAR
        run: |
          mkdir -p out
          javac -cp "$(ls *.jar | tr '\n' ':')" -d out CreeperWitherFix.java
          cp plugin.yml out/
          jar cf CreeperWitherFix-1.0.jar -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: CreeperWitherFix
          path: CreeperWitherFix-1.0.jar
